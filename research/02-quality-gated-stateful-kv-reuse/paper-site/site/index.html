<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quality-Gated Attention-State Reuse for Local Tool-Using Agents</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #151515;
      --muted: #5f6368;
      --line: #d9d9d9;
      --bg: #f6f6f4;
      --panel: #ffffff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.25;
      font-weight: 650;
      letter-spacing: 0;
    }

    .meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex: 0 0 auto;
    }

    a {
      color: inherit;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fafafa;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }

    main {
      height: calc(100% - 64px);
      padding: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .fallback {
      padding: 24px;
      font-size: 15px;
    }

    @media (max-width: 640px) {
      header {
        align-items: flex-start;
        flex-direction: column;
        min-height: 112px;
      }

      main {
        height: calc(100% - 112px);
      }

      .actions {
        width: 100%;
      }

      .button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Quality-Gated Attention-State Reuse for Local Tool-Using Agents</h1>
      <div class="meta">Final arXiv v1 snapshot PDF</div>
    </div>
    <nav class="actions" aria-label="PDF actions">
      <a class="button" href="paper.pdf">Open PDF</a>
      <a class="button" href="paper.pdf" download>Download</a>
    </nav>
  </header>
  <main>
    <iframe src="paper.pdf" title="Final paper PDF">
      <div class="fallback">
        This browser cannot display the PDF inline. <a href="paper.pdf">Open the PDF directly.</a>
      </div>
    </iframe>
  </main>
</body>
</html>
